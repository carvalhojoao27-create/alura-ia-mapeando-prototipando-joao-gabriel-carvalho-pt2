<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotina de Sexta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #12001c, #3a0066, #7a00cc, #240046); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #fff; min-height: 100vh; overflow-x: hidden; position: relative; padding: 20px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .shape { position: fixed; z-index: 0; opacity: 0.5; animation: fly3D 20s linear infinite; pointer-events: none; }
        .cube { background: rgba(153, 51, 255, 0.15); backdrop-filter: blur(4px); border: 1px solid rgba(204, 153, 255, 0.4); }
        .pyramid { width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 80px solid rgba(170, 0, 255, 0.5); }
        .shape1 { width: 100px; height: 100px; left: 25%; bottom: -120px; animation-duration: 14s; }
        .shape2 { left: 75%; bottom: -100px; animation-duration: 19s; animation-delay: 3s; }
        @keyframes fly3D { 0% { transform: translateY(100px) rotate(0deg); } 100% { transform: translateY(-120vh) rotate(360deg); } }
        .page-content { max-width: 800px; margin: 40px auto; padding: 40px; background: rgba(40, 0, 80, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(180, 100, 255, 0.5); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; z-index: 10; }
        .page-content h1 { color: #d494ff; margin-bottom: 15px; text-align: center; border-bottom: 2px solid rgba(180, 100, 255, 0.3); padding-bottom: 15px; }
        .page-content p { text-align: center; color: #eeddff; margin-bottom: 25px; font-size: 1.1rem; }
        .page-content ul { list-style: none; }
        .page-content li { font-size: 1.2rem; margin-bottom: 15px; padding-left: 25px; position: relative; color: #f3e6ff; }
        .page-content li::before { content: "➔"; position: absolute; left: 0; color: #a855f7; }
        .btn-voltar { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: #7a00cc; color: #fff; border-radius: 8px; font-weight: bold; transition: 0.3s; cursor: pointer; border: none; font-size: 1rem; }
        .btn-voltar:hover { background: #9933ff; transform: translateX(-5px); }
    </style>
</head>
<body>
    <div class="shape cube shape1"></div>
    <div class="shape pyramid shape2"></div>

    <div class="page-content">
        <button class="btn-voltar" onclick="voltarParaHome()">⬅ Voltar para Home</button>
        <h1>Detalhes da Sexta-feira 🍕</h1>
        <p>Dia de comemorar o fim da semana letiva com boa comida e lazer.</p>
        <ul>
            <li>Acordar e escovar os dentes.</li>
            <li>Último dia de escola da semana.</li>
            <li>Sair para comer algo diferente ou ir a um local de lazer.</li>
            <li>Virar a noite (ou quase) jogando no PC.</li>
        </ul>
    </div>

    <script>
        function voltarParaHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
